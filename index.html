<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>VOXELIA • Food 3D Model Viewer</title>
  <style>
    :root{
      --bg:#07111f; --panel:#0d1c2f; --panel2:#11243b; --line:#24405e;
      --text:#f5f8ff; --muted:#9fb1c8; --accent:#59c6ff;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{overflow:hidden}
    .app{display:grid;grid-template-columns:310px minmax(0,1fr);height:100dvh}
    .sidebar{border-right:1px solid var(--line);background:linear-gradient(180deg,#0b1728,#08121f);
      display:flex;flex-direction:column;min-height:0}
    .brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
    .brand h1{font-size:23px;margin:0;letter-spacing:.08em}
    .brand p{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
    .list{overflow:auto;padding:10px}
    .food{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;width:100%;
      border:1px solid transparent;background:transparent;color:inherit;border-radius:12px;padding:9px 10px;
      text-align:left;cursor:pointer}
    .food:hover{background:#10233a}.food.active{border-color:#3a719c;background:#14304e}
    .swatch{width:38px;height:38px;border-radius:10px;border:1px solid #ffffff2c;box-shadow:inset 0 0 14px #0005}
    .food .name{font-weight:800;font-size:13px}.food .id{color:var(--muted);font-size:11px;margin-top:2px}
    .badge{font:700 10px/1 ui-monospace,monospace;color:#c9def2}
    .main{position:relative;min-width:0;min-height:0}
    #view{position:absolute;inset:0}
    #view canvas{display:block;width:100%;height:100%;touch-action:none}
    .topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:flex-start;
      pointer-events:none}
    .info,.tools{pointer-events:auto;background:#081523df;border:1px solid #284966;border-radius:14px;
      backdrop-filter:blur(12px);box-shadow:0 12px 40px #0006}
    .info{padding:12px 14px;min-width:min(420px,60vw)}
    .eyebrow{font:800 10px/1.2 ui-monospace,monospace;letter-spacing:.16em;color:#8ecbf4}
    #title{font-size:24px;font-weight:900;margin:4px 0 0}.meta{color:var(--muted);font-size:12px;margin-top:5px}
    .tools{margin-left:auto;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:52vw}
    button.control{border:1px solid #315573;background:#10243a;color:#eef7ff;border-radius:9px;padding:8px 10px;
      font-size:11px;font-weight:800;cursor:pointer}
    button.control:hover{background:#173451}.control.active{border-color:#70d0ff;background:#174264}
    .angles{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:5px;flex-wrap:wrap;
      justify-content:center;width:min(92%,760px);background:#081523dd;border:1px solid #284966;border-radius:14px;
      padding:8px;backdrop-filter:blur(10px)}
    .details{position:absolute;right:14px;bottom:76px;width:min(330px,44vw);background:#081523df;
      border:1px solid #284966;border-radius:14px;padding:12px 14px;backdrop-filter:blur(10px)}
    .details div{font-size:11px;line-height:1.55;color:var(--muted)}.details strong{color:#fff}
    @media(max-width:800px){
      .app{grid-template-columns:1fr}.sidebar{position:absolute;z-index:10;left:10px;top:80px;bottom:84px;width:245px;
        border:1px solid var(--line);border-radius:14px;transform:translateX(calc(-100% - 18px));transition:.22s}
      .sidebar.open{transform:none}.brand{display:none}
      .mobileMenu{display:block!important}.info{min-width:0;max-width:70vw}.tools{max-width:30vw}
      .details{display:none}
    }
    .mobileMenu{display:none}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>VOXELIA</h1>
      <p>Food-only procedural 3D library. Drag to orbit, scroll/pinch to zoom, and export the selected model as GLB.</p>
    </div>
    <div class="list" id="foodList"></div>
  </aside>

  <main class="main">
    <div id="view"></div>
    <div class="topbar">
      <div class="info">
        <div class="eyebrow">VOXELIA • FOOD 3D MODEL</div>
        <div id="title">Sunberry</div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="tools">
        <button class="control mobileMenu" id="menuBtn">Foods</button>
        <button class="control" id="autoBtn">Auto rotate</button>
        <button class="control" id="wireBtn">Wireframe</button>
        <button class="control" id="gridBtn">Grid</button>
        <button class="control" id="pngBtn">PNG</button>
        <button class="control" id="glbBtn">GLB</button>
        <button class="control" id="resetBtn">Reset</button>
      </div>
    </div>

    <div class="details" id="details"></div>

    <div class="angles">
      <button class="control" data-view="iso">3/4</button>
      <button class="control" data-view="front">Front</button>
      <button class="control" data-view="back">Back</button>
      <button class="control" data-view="left">Left</button>
      <button class="control" data-view="right">Right</button>
      <button class="control" data-view="top">Top</button>
      <button class="control" data-view="bottom">Bottom</button>
    </div>
  </main>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./foods.js"></script>
</body>
</html>
